# kubectl apply -f infra/cluster-issuer.yaml
#
# Requires a Secret named cloudflare-api-token in the cert-manager namespace
# first — see infra/README.md for the exact command (deliberately not run
# by anything automated: it carries a live Cloudflare credential).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@rosetraviss.uk
    privateKeySecretRef:
      name: letsencrypt-cloudflare-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
