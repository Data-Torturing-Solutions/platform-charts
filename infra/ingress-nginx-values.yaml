# helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#   -n ingress-nginx --create-namespace -f infra/ingress-nginx-values.yaml
#
# PROXY protocol must be on at BOTH ends (the DO LB annotation below, and
# use-proxy-protocol in the ConfigMap) or proxy-real-ip-cidr matches nothing:
# without it, ingress-nginx sees the DO Load Balancer's own address as the
# source, not Cloudflare's edge IP, and every request looks like it came
# from an untrusted source.

controller:
  service:
    annotations:
      # Since DOKS 1.33.1-do.0, the default LB type is REGIONAL_NETWORK,
      # which silently ignores enable-proxy-protocol — the annotation sits
      # on the Service with no effect and no error. Confirmed the hard way:
      # direct TLS to the LB reset every connection (nginx expecting a
      # PROXY preamble that never arrived, failing to parse the raw
      # ClientHello as one). REGIONAL is the type that actually honors it.
      service.beta.kubernetes.io/do-loadbalancer-type: "REGIONAL"
      service.beta.kubernetes.io/do-loadbalancer-enable-proxy-protocol: "true"
      # Plain TCP/HTTPS passthrough — no do-loadbalancer-certificate-id set,
      # so the LB does not terminate TLS itself. cert-manager-issued certs
      # inside the cluster are the only TLS termination point.
      service.beta.kubernetes.io/do-loadbalancer-protocol: "tcp"

  config:
    use-proxy-protocol: "true"
    use-forwarded-headers: "true"
    # Cloudflare's published CIDR list (same set already verified in
    # jpmc-tech/deploy/Caddyfile.template's trusted_proxies block) — only
    # traffic actually arriving via PROXY protocol from these ranges gets
    # its forwarded headers trusted.
    proxy-real-ip-cidr: >-
      173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,
      141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,
      197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,
      104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,
      2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,
      2a06:98c0::/29,2c0f:f248::/32
    server-tokens: "false"
    # server_tokens off only hides the version, not the header itself —
    # this clears it entirely, matching what every app's own Caddy already
    # does today (-Server) and what jpmc-tech's anonymity requirement
    # specifically depends on.
    http-snippet: |
      more_clear_headers "Server";

  admissionWebhooks:
    enabled: true
