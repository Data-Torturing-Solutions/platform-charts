{{- $root := . }}
{{- range $job := .Values.cronjobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "app-base.fullname" $root }}-{{ $job.name }}
  labels:
    {{- include "app-base.labels" $root | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  concurrencyPolicy: {{ $job.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      {{- if $job.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
      {{- end }}
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "app-base.labels" $root | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "app-base.serviceAccountName" $root }}
          {{- if $root.Values.persistence.enabled }}
          # RWO volumes attach to one node at a time (confirmed against DO's
          # CSI: a job pod on a different node than the Deployment's pod hangs
          # in ContainerCreating with a Multi-Attach error, forever — Forbid
          # concurrency alone doesn't help since this is node placement, not
          # overlap). Require landing on a node that already has a pod from
          # this release, so the CronJob can actually attach the same PVC.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      {{- include "app-base.selectorLabels" $root | nindent 22 }}
                  topologyKey: kubernetes.io/hostname
          {{- end }}
          securityContext:
            {{- toYaml $root.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: {{ $job.name }}
              image: {{ $job.image | default (include "app-base.image" $root) }}
              imagePullPolicy: {{ $root.Values.image.pullPolicy }}
              securityContext:
                {{- toYaml $root.Values.securityContext | nindent 16 }}
              {{- with $job.command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $job.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $job.env }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $job.envFrom }}
              envFrom:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              resources:
                {{- toYaml ($job.resources | default $root.Values.resources) | nindent 16 }}
              {{- if or $root.Values.persistence.enabled $job.volumeMounts }}
              volumeMounts:
                {{- if $root.Values.persistence.enabled }}
                - name: data
                  mountPath: {{ $root.Values.persistence.mountPath }}
                {{- end }}
                {{- with $job.volumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- end }}
          {{- if $root.Values.persistence.enabled }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "app-base.fullname" $root }}
          {{- end }}
{{- end }}
