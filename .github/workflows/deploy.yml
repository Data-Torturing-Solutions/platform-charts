name: Deploy

on:
  workflow_call:
    inputs:
      app_name:
        description: Helm release name and DOCR repo name for this app
        required: true
        type: string
      namespace:
        description: Kubernetes namespace (created if missing)
        required: true
        type: string
      chart_version:
        description: app-base chart version to deploy
        required: false
        type: string
        default: "0.1.4"
      cluster_name:
        description: DOKS cluster name
        required: false
        type: string
        default: "rosetraviss-lon1"
      registry:
        description: OCI registry path for images and the app-base chart
        required: false
        type: string
        default: "ghcr.io/data-torturing-solutions"
      context:
        description: Docker build context
        required: false
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: "Dockerfile"
      values_file:
        description: Path to this app's Helm values file
        required: false
        type: string
        default: "deploy/values.yaml"
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN:
        required: true
      GIT_CLONE_TOKEN:
        description: Read-only PAT for pulling private git dependencies at build time (e.g. placegraph). Only needed by apps whose Dockerfile mounts a "github_token" build secret.
        required: false
      GHCR_PULL_TOKEN:
        description: PAT with read:packages, used to build the cluster's imagePullSecret. GITHUB_TOKEN cannot be used — it expires when the job ends, but the kubelet pulls long after that.
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push images and the app-base chart to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # GHCR replaces DOCR: the Professional tier was $20/mo for 11.65 GB
      # across 20 repos, and GHCR is free for private packages at this volume.
      # GITHUB_TOKEN can push to packages owned by this org, so no PAT is
      # needed here — but the cluster still needs one to pull (see below).
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.app_name }}:${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GIT_CLONE_TOKEN }}

      - name: Save kubeconfig
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
        run: doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      # The cluster pulls on its own behalf, long after this job's
      # GITHUB_TOKEN has expired, so the imagePullSecret needs a durable
      # credential. DOKS used to inject one automatically for DOCR; nothing
      # does that for GHCR, so we upsert it here on every deploy.
      - name: Ensure GHCR pull secret
        env:
          NAMESPACE: ${{ inputs.namespace }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN:-}" ]; then
            echo "::error::GHCR_PULL_TOKEN is not set. Create a PAT with read:packages and add it as an org secret." >&2
            exit 1
          fi
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USER" \
            --docker-password="$GHCR_TOKEN" \
            -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        env:
          APP_NAME: ${{ inputs.app_name }}
          REGISTRY: ${{ inputs.registry }}
          CHART_VERSION: ${{ inputs.chart_version }}
          NAMESPACE: ${{ inputs.namespace }}
          VALUES_FILE: ${{ inputs.values_file }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # docker login does not authenticate helm's OCI client; the chart
          # lives in the same private registry, so helm needs its own login.
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

          helm upgrade --install "$APP_NAME" \
            "oci://$REGISTRY/charts/app-base" \
            --version "$CHART_VERSION" \
            --namespace "$NAMESPACE" --create-namespace \
            -f "$VALUES_FILE" \
            --set image.repository="$REGISTRY/$APP_NAME" \
            --set image.tag="$IMAGE_TAG" \
            --set serviceAccount.imagePullSecrets[0].name=ghcr \
            --atomic --timeout 3m
