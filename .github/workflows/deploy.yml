name: Deploy

on:
  workflow_call:
    inputs:
      app_name:
        description: Helm release name and DOCR repo name for this app
        required: true
        type: string
      namespace:
        description: Kubernetes namespace (created if missing)
        required: true
        type: string
      chart_version:
        description: app-base chart version to deploy
        required: false
        type: string
        default: "0.1.4"
      cluster_name:
        description: DOKS cluster name
        required: false
        type: string
        default: "rosetraviss-lon1"
      registry:
        description: DOCR registry path
        required: false
        type: string
        default: "registry.digitalocean.com/rosetraviss"
      context:
        description: Docker build context
        required: false
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: "Dockerfile"
      values_file:
        description: Path to this app's Helm values file
        required: false
        type: string
        default: "deploy/values.yaml"
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN:
        required: true
      GIT_CLONE_TOKEN:
        description: Read-only PAT for pulling private git dependencies at build time (e.g. placegraph). Only needed by apps whose Dockerfile mounts a "github_token" build secret.
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.app_name }}:${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GIT_CLONE_TOKEN }}

      - name: Save kubeconfig
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
        run: doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Deploy
        env:
          APP_NAME: ${{ inputs.app_name }}
          REGISTRY: ${{ inputs.registry }}
          CHART_VERSION: ${{ inputs.chart_version }}
          NAMESPACE: ${{ inputs.namespace }}
          VALUES_FILE: ${{ inputs.values_file }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install "$APP_NAME" \
            "oci://$REGISTRY/charts/app-base" \
            --version "$CHART_VERSION" \
            --namespace "$NAMESPACE" --create-namespace \
            -f "$VALUES_FILE" \
            --set image.repository="$REGISTRY/$APP_NAME" \
            --set image.tag="$IMAGE_TAG" \
            --atomic --timeout 3m
