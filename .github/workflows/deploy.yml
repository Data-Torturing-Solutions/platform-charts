name: Deploy

on:
  workflow_call:
    inputs:
      app_name:
        description: Helm release name and DOCR repo name for this app
        required: true
        type: string
      namespace:
        description: Kubernetes namespace (created if missing)
        required: true
        type: string
      chart_version:
        description: app-base chart version to deploy
        required: false
        type: string
        default: "0.1.4"
      cluster_name:
        description: DOKS cluster name
        required: false
        type: string
        default: "rosetraviss-lon1"
      registry:
        description: DOCR registry path
        required: false
        type: string
        default: "registry.digitalocean.com/rosetraviss"
      context:
        description: Docker build context
        required: false
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: "Dockerfile"
      values_file:
        description: Path to this app's Helm values file
        required: false
        type: string
        default: "deploy/values.yaml"
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN:
        required: true
      GIT_CLONE_TOKEN:
        description: Read-only PAT for pulling private git dependencies at build time (e.g. placegraph). Only needed by apps whose Dockerfile mounts a "github_token" build secret.
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.app_name }}:${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GIT_CLONE_TOKEN }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ inputs.cluster_name }}

      - uses: azure/setup-helm@v4

      - name: Deploy
        run: |
          helm upgrade --install "${{ inputs.app_name }}" \
            "oci://${{ inputs.registry }}/charts/app-base" \
            --version "${{ inputs.chart_version }}" \
            --namespace "${{ inputs.namespace }}" --create-namespace \
            -f "${{ inputs.values_file }}" \
            --set image.repository="${{ inputs.registry }}/${{ inputs.app_name }}" \
            --set image.tag="${{ github.sha }}" \
            --atomic --timeout 3m
